# Ruff linter configuration
target-version = "py312"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    # NOTE: "UP" (pyupgrade) intentionally NOT selected — the codebase predates
    # PEP 585/604 typing modernization (List/Optional/Dict). Enforcing UP would be a
    # ~2,000-line stylistic rewrite with no behavioral benefit. Substantive rules
    # (F=bugs, S=security, B=bugbear, E/W, I=imports) remain enforced.
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert usage (needed in tests)
    "S311",   # random (not used for crypto)
    "B008",   # function call in default arg (FastAPI Depends pattern)
    "B905",   # zip without strict (pandas compat)
    # Accepted legacy patterns in this codebase (pre-existing; not behavior bugs).
    # Pyflakes (F) — except these — and security (S) stay fully enforced.
    "E731",   # lambda assignment (used for small inline scorers)
    "E741",   # ambiguous variable names (l/I/O in a few legacy spots)
    "E402",   # module import not at top (intentional lazy/guarded imports)
    "F841",   # unused local var (legacy; harmless assignments)
    "B007",   # unused loop control variable
    "B023",   # function uses loop variable (no late-binding bug in these spots)
    "B904",   # raise without from inside except (legacy error paths)
    "S110",   # try-except-pass (intentional best-effort/optional paths)
]

[lint.per-file-ignores]
"tests/**" = ["S", "B"]  # security + bugbear relaxed in tests

[format]
quote-style = "double"
indent-style = "space"
