version: 2
updates:
  # Python dependencies for the RAG application
  - package-ecosystem: "pip"
    directory: "/financial-report-insights"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Batch low-risk minor/patch bumps into one PR to reduce noise;
      # major bumps come as individual PRs so they get focused review + CI.
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions pinned versions current (security-relevant)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
