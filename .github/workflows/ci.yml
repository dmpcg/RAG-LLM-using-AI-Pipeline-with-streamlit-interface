name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
    paths:
      - "financial-report-insights/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "financial-report-insights/**"

defaults:
  run:
    working-directory: financial-report-insights

# Cancel superseded runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# WS-1 P1-F2 (2026-05-07): default least-privilege token for the workflow.
# Individual jobs that need write access (none currently in this file) must
# elevate explicitly via their own ``permissions:`` block.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stage 1: Lint & Static Analysis
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (WS-1 P1-F1)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: financial-report-insights/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff==0.14.14 mypy   # pinned so `format --check` is deterministic vs the version we format with

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy type check (structured_types)
        run: mypy structured_types.py --ignore-missing-imports --no-error-summary || true

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Security Scanning
  # ──────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (WS-1 P1-F1)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: financial-report-insights/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit safety pip-audit

      - name: Bandit security scan
        run: bandit -r . -x ./tests -f json -o bandit-report.json --severity-level medium

      - name: pip-audit dependency scan (requirements, strict, hard gate)
        # WS-1 P1-F4: pip-audit failures are a hard CI gate.
        # Audits requirements.txt (resolvable ranges carrying the CVE floors) — the
        # same file the Docker image installs from. NOTE: the hand-maintained
        # requirements.lock has drifted (stale/fabricated pins) and should be
        # regenerated with `pip-compile --generate-hashes` before it is re-adopted.
        #
        # Accepted/ignored advisory (documented risk-acceptance, revisit when FastAPI
        # officially supports Starlette 1.0):
        #   PYSEC-2026-161 (starlette <1.0.1): Host-header path-injection. The only fix
        #   is starlette 1.0.1 (a major bump outside the current FastAPI-compatible
        #   range). Low applicability here — routing is path-based (per the advisory),
        #   and CORS is enforced via a config allow-list, not Host reflection.
        run: pip-audit --requirement requirements.txt --strict --desc --ignore-vuln PYSEC-2026-161 --format json --output pip-audit-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: security-reports
          path: |
            financial-report-insights/bandit-report.json
            financial-report-insights/pip-audit-report.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Test Suite
  # ──────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (WS-1 P1-F1)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: financial-report-insights/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            -q --tb=short \
            --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing \
            -n auto \
            --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            financial-report-insights/test-results.xml
            financial-report-insights/coverage.xml
          retention-days: 30

      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          pip install coverage
          python -m coverage report --fail-under=60

  # ──────────────────────────────────────────────────────────────
  # Stage 4: Build Validation
  # ──────────────────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (WS-1 P1-F1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: financial-report-insights
          push: false
          tags: rag-financial-insights:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify image
        run: |
          docker images rag-financial-insights:${{ github.sha }}
          echo "Image built successfully"

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # v0.28.0
        with:
          image-ref: rag-financial-insights:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ──────────────────────────────────────────────────────────────
  # Stage 5: Quality Gate
  # ──────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, security, test, build]
    if: always()
    steps:
      - name: Check all stages
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"

          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "::error::Lint stage failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "::error::Test stage failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "::error::Build stage failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "::error::Security scan failed — review artifacts before merging"
            exit 1
          fi

          echo "✅ Quality gate passed"
