name: Repository Health

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (WS-1 P1-F1)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: pip install pip-audit

      - name: Run health check
        id: health
        run: python .github/scripts/health_check.py

      - name: Close previous health issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'repo-health',
              per_page: 10,
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Create health report issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Health check completed. See workflow logs for details.';
            try {
              body = fs.readFileSync('.github/metrics/health-report.md', 'utf8');
            } catch (e) {}

            const labels = ['repo-health'];
            const hasCritical = '${{ steps.health.outputs.has_critical }}' === 'true';
            if (hasCritical) labels.push('needs-attention');

            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Health] Repository health report - ${date}`,
              body: body + '\n\n*Auto-generated by repo-health workflow*',
              labels: labels,
            });

      - name: Upload health metrics as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: health-metrics
          path: .github/metrics/health-report.json
          retention-days: 90
